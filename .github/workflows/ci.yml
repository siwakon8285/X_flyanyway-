name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed lines for whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_BASE_SHA"
            test -n "$PR_HEAD_SHA"
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              git show --check --format= "$PUSH_SHA"
            else
              git diff --check "$PUSH_BEFORE_SHA" "$PUSH_SHA"
            fi
          fi

      - name: Validate Compose configuration
        run: docker compose --profile test config --quiet

  backend:
    name: Backend checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: x_fly_concurrency_test
          POSTGRES_USER: x_fly_ci_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          TZ: UTC
        ports:
          - "5434:5432"
        options: >-
          --health-cmd "pg_isready -U x_fly_ci_bootstrap -d x_fly_concurrency_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 5s
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mask ephemeral bootstrap credential
        env:
          CI_BOOTSTRAP_PASSWORD: ci-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CI_BOOTSTRAP_PASSWORD"

      - name: Select Rust 1.98.0
        working-directory: backend
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          test "$(rustc --version | awk '{print $2}')" = "1.98.0"
          test "$(cargo --version | awk '{print $2}')" = "1.98.0"

      - name: Check Rust formatting
        working-directory: backend
        run: cargo fmt --check

      - name: Build backend
        working-directory: backend
        run: cargo build --locked

      - name: Check backend lints
        working-directory: backend
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Verify RustSec exception reachability assumptions
        working-directory: backend
        run: |
          set -euo pipefail

          check_inactive() {
            local package="$1"
            local message="$2"
            local tree

            if ! tree="$(cargo tree --locked -e normal,build,dev -i "$package")"; then
              echo "cargo tree failed while checking $package" >&2
              return 1
            fi

            if [[ -n "${tree//[[:space:]]/}" ]]; then
              echo "$message" >&2
              return 1
            fi
          }

          check_inactive rsa \
            "RUSTSEC-2023-0071 exception requires review: rsa is active"
          check_inactive sqlx-mysql \
            "RUSTSEC-2023-0071 exception requires review: sqlx-mysql is active"

      - name: Install cargo-audit
        working-directory: backend
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        working-directory: backend
        run: cargo audit

      - name: Generate ephemeral project credentials
        working-directory: backend
        run: |
          set -euo pipefail
          umask 077
          migrator_password="$(openssl rand -hex 32)"
          runtime_password="$(openssl rand -hex 32)"
          echo "::add-mask::$migrator_password"
          echo "::add-mask::$runtime_password"
          {
            printf 'CI_MIGRATOR_PASSWORD=%s\n' "$migrator_password"
            printf 'CI_RUNTIME_PASSWORD=%s\n' "$runtime_password"
          } >> "$GITHUB_ENV"

      - name: Prove CI database identity
        working-directory: backend
        env:
          PGPASSWORD: ci-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          identity="$(psql --no-psqlrc --tuples-only --no-align \
            --host 127.0.0.1 --port 5434 \
            --username x_fly_ci_bootstrap --dbname x_fly_concurrency_test \
            --command "SELECT current_database() || '|' || current_user;")"
          test "$identity" = "x_fly_concurrency_test|x_fly_ci_bootstrap"

      - name: Provision project roles
        working-directory: backend
        env:
          PGPASSWORD: ci-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          psql --no-psqlrc --set=ON_ERROR_STOP=1 \
            --host 127.0.0.1 --port 5434 \
            --username x_fly_ci_bootstrap --dbname x_fly_concurrency_test \
            --set=project_database=x_fly_concurrency_test \
            --file provisioning/project_roles.sql

      - name: Set ephemeral project-role passwords
        working-directory: backend
        env:
          PGPASSWORD: ci-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          psql --no-psqlrc --set=ON_ERROR_STOP=1 \
            --host 127.0.0.1 --port 5434 \
            --username x_fly_ci_bootstrap --dbname x_fly_concurrency_test <<'SQL'
          \set ON_ERROR_STOP on
          \getenv migrator_password CI_MIGRATOR_PASSWORD
          \getenv runtime_password CI_RUNTIME_PASSWORD
          ALTER ROLE x_fly_migrator PASSWORD :'migrator_password';
          ALTER ROLE x_fly_runtime PASSWORD :'runtime_password';
          SQL

      - name: Verify project role and extension boundaries
        working-directory: backend
        env:
          PGPASSWORD: ci-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          role_status="$(psql --no-psqlrc --tuples-only --no-align \
            --host 127.0.0.1 --port 5434 \
            --username x_fly_ci_bootstrap --dbname x_fly_concurrency_test \
            --command "SELECT CASE WHEN COUNT(*) = 2 AND bool_and(rolcanlogin AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls AND NOT rolinherit) THEN 'ok' ELSE 'bad' END FROM pg_roles WHERE rolname IN ('x_fly_migrator', 'x_fly_runtime');")"
          test "$role_status" = "ok"

          membership_count="$(psql --no-psqlrc --tuples-only --no-align \
            --host 127.0.0.1 --port 5434 \
            --username x_fly_ci_bootstrap --dbname x_fly_concurrency_test \
            --command "SELECT COUNT(*) FROM pg_auth_members membership JOIN pg_roles member ON member.oid = membership.member WHERE member.rolname IN ('x_fly_migrator', 'x_fly_runtime');")"
          test "$membership_count" = "0"

          extension_status="$(psql --no-psqlrc --tuples-only --no-align \
            --host 127.0.0.1 --port 5434 \
            --username x_fly_ci_bootstrap --dbname x_fly_concurrency_test \
            --command "SELECT CASE WHEN (SELECT extowner::regrole::text FROM pg_extension WHERE extname = 'pgcrypto') = 'x_fly_ci_bootstrap' AND (SELECT extowner::regrole::text FROM pg_extension WHERE extname = 'pg_trgm') = 'x_fly_ci_bootstrap' THEN 'ok' ELSE 'bad' END;")"
          test "$extension_status" = "ok"

      - name: Run controlled migrations
        working-directory: backend
        run: |
          set -euo pipefail
          migration_url="postgresql://x_fly_migrator:${CI_MIGRATOR_PASSWORD}@127.0.0.1:5434/x_fly_concurrency_test"
          echo "::add-mask::$migration_url"
          MIGRATION_DATABASE_URL="$migration_url" cargo run --locked --bin db_admin -- migrate

      - name: Verify fresh migration inventory and ownership
        working-directory: backend
        run: |
          set -euo pipefail
          export PGPASSWORD="$CI_MIGRATOR_PASSWORD"
          migration_status="$(psql --no-psqlrc --tuples-only --no-align \
            --host 127.0.0.1 --port 5434 \
            --username x_fly_migrator --dbname x_fly_concurrency_test \
            --command "SELECT COUNT(*) FILTER (WHERE success) || '|' || COUNT(*) FROM _sqlx_migrations;")"
          test "$migration_status" = "26|26"

          table_count="$(psql --no-psqlrc --tuples-only --no-align \
            --host 127.0.0.1 --port 5434 \
            --username x_fly_migrator --dbname x_fly_concurrency_test \
            --command "SELECT COUNT(*) FROM pg_tables WHERE schemaname = 'public';")"
          test "$table_count" = "34"

          owner_count="$(psql --no-psqlrc --tuples-only --no-align \
            --host 127.0.0.1 --port 5434 \
            --username x_fly_migrator --dbname x_fly_concurrency_test \
            --command "SELECT COUNT(*) FROM pg_tables WHERE schemaname = 'public' AND tableowner = 'x_fly_migrator';")"
          test "$owner_count" = "34"

          function_owner="$(psql --no-psqlrc --tuples-only --no-align \
            --host 127.0.0.1 --port 5434 \
            --username x_fly_migrator --dbname x_fly_concurrency_test \
            --command "SELECT COALESCE((SELECT proowner::regrole::text FROM pg_proc WHERE pronamespace = 'public'::regnamespace AND proname = 'has_protected_stripe_card_finalization' AND pronargs = 1), 'missing');")"
          test "$function_owner" = "x_fly_migrator"

      - name: Apply runtime grants
        working-directory: backend
        env:
          PGPASSWORD: ci-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          psql --no-psqlrc --set=ON_ERROR_STOP=1 \
            --host 127.0.0.1 --port 5434 \
            --username x_fly_ci_bootstrap --dbname x_fly_concurrency_test \
            --set=project_database=x_fly_concurrency_test \
            --file provisioning/runtime_grants.sql

      - name: Run explicit guarded demo seed
        working-directory: backend
        run: |
          set -euo pipefail
          migration_url="postgresql://x_fly_migrator:${CI_MIGRATOR_PASSWORD}@127.0.0.1:5434/x_fly_concurrency_test"
          echo "::add-mask::$migration_url"
          MIGRATION_DATABASE_URL="$migration_url" \
            DEMO_SEED_DATABASE=x_fly_concurrency_test \
            cargo run --locked --bin db_admin -- seed-demo

      - name: Run focused lifecycle and permission tests
        working-directory: backend
        run: |
          set -euo pipefail
          test_url="postgresql://x_fly_migrator:${CI_MIGRATOR_PASSWORD}@127.0.0.1:5434/x_fly_concurrency_test"
          runtime_url="postgresql://x_fly_runtime:${CI_RUNTIME_PASSWORD}@127.0.0.1:5434/x_fly_concurrency_test"
          echo "::add-mask::$test_url"
          echo "::add-mask::$runtime_url"
          DATABASE_URL=postgresql://ci_forbidden@127.0.0.1:1/ci_forbidden \
            TEST_DATABASE_URL="$test_url" \
            TEST_RUNTIME_DATABASE_URL="$runtime_url" \
            cargo test --locked \
              --test test_database_config \
              --test database_lifecycle \
              --test runtime_database_permissions \
              --no-fail-fast

      - name: Run full backend test suite
        working-directory: backend
        run: |
          set -euo pipefail
          test_url="postgresql://x_fly_migrator:${CI_MIGRATOR_PASSWORD}@127.0.0.1:5434/x_fly_concurrency_test"
          runtime_url="postgresql://x_fly_runtime:${CI_RUNTIME_PASSWORD}@127.0.0.1:5434/x_fly_concurrency_test"
          echo "::add-mask::$test_url"
          echo "::add-mask::$runtime_url"
          DATABASE_URL=postgresql://ci_forbidden@127.0.0.1:1/ci_forbidden \
            TEST_DATABASE_URL="$test_url" \
            TEST_RUNTIME_DATABASE_URL="$runtime_url" \
            cargo test --locked --no-fail-fast

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm 11.17.0
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
